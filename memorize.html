<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Memorization</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Figtree:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f1ea;
  --surface: #e9e4da;
  --fg: #2c2a26;
  --fg-dim: #807a70;
  --accent: #b08930;
  --accent-hover: #967528;
  --accent-soft: rgba(176, 137, 48, 0.10);
  --green: #3e7a50;
  --green-soft: rgba(62, 122, 80, 0.10);
  --red: #b84a3c;
  --red-soft: rgba(184, 74, 60, 0.10);
  --blank-bg: rgba(176, 137, 48, 0.13);
  --mantra: 'Spectral', 'Georgia', serif;
  --ui: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151525;
    --surface: #1e1e34;
    --fg: #e4e0d6;
    --fg-dim: #8a849a;
    --accent: #d4aa44;
    --accent-hover: #c09530;
    --accent-soft: rgba(212, 170, 68, 0.12);
    --green: #5cb87a;
    --green-soft: rgba(92, 184, 122, 0.12);
    --red: #e06050;
    --red-soft: rgba(224, 96, 80, 0.12);
    --blank-bg: rgba(212, 170, 68, 0.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151525;
  --surface: #1e1e34;
  --fg: #e4e0d6;
  --fg-dim: #8a849a;
  --accent: #d4aa44;
  --accent-hover: #c09530;
  --accent-soft: rgba(212, 170, 68, 0.12);
  --green: #5cb87a;
  --green-soft: rgba(92, 184, 122, 0.12);
  --red: #e06050;
  --red-soft: rgba(224, 96, 80, 0.12);
  --blank-bg: rgba(212, 170, 68, 0.15);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  padding-inline: 16px;
  padding-block: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrap {
  width: 100%;
  max-width: 600px;
  padding-block: 28px 48px;
}

/* --- Menu --- */
#menu { text-align: center; }
#menu h1 {
  font-family: var(--mantra);
  font-weight: 600;
  font-size: 1.4rem;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}
#menu .subtitle {
  font-size: 0.8rem;
  color: var(--fg-dim);
  margin-bottom: 32px;
}
.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.prayer-btn {
  display: block;
  width: 100%;
  padding: 20px 24px;
  background: var(--surface);
  border: 1px solid var(--accent-soft);
  border-radius: var(--r);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.2s, background 0.2s;
  font-family: var(--ui);
}
.prayer-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.prayer-btn .prayer-name {
  font-family: var(--mantra);
  font-weight: 600;
  font-size: 1.1rem;
  color: var(--fg);
  margin-bottom: 4px;
}
.prayer-btn .prayer-info {
  font-size: 0.78rem;
  color: var(--fg-dim);
}

/* --- Practice Screen --- */
#practice { display: none; }
#practice h1 {
  font-family: var(--mantra);
  font-weight: 600;
  font-size: 1.25rem;
  text-align: center;
  color: var(--accent);
  margin: 0 0 4px;
  letter-spacing: 0.03em;
}
.back-row { margin-bottom: 16px; }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--fg-dim);
  font-family: var(--ui);
  font-size: 0.82rem;
  cursor: pointer;
  padding: 4px 0;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--accent); }

/* --- Fill Lines --- */
.blanks-area {
  font-family: var(--mantra);
  font-size: 1rem;
  line-height: 1.85;
  letter-spacing: 0.01em;
}
.blanks-stanza {
  display: block;
  margin-bottom: 14px;
}
.blanks-stanza .line { display: block; }
.blanks-stanza-num {
  font-family: var(--ui);
  font-size: 0.68rem;
  color: var(--fg-dim);
  opacity: 0.5;
  display: block;
  margin-bottom: 1px;
}
.line-blank {
  display: block;
  background: var(--blank-bg);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  min-height: 1.85em;
  transition: all 0.2s;
  border: 1px solid transparent;
  user-select: none;
  margin-bottom: 2px;
}
.line-blank:hover { border-color: var(--accent); }
.line-blank .line-text { display: none; }
.line-blank .line-placeholder { color: var(--fg-dim); opacity: 0.35; font-family: var(--ui); font-size: 0.8rem; }
.line-blank.show {
  background: none;
  border-color: transparent;
  cursor: pointer;
}
.line-blank.show .line-text { display: inline; }
.line-blank.show .line-placeholder { display: none; }
.line-blank.show:hover {
  background: var(--red-soft);
  border-color: var(--red);
}

/* --- Tree View --- */
.tree-area {
  font-family: var(--mantra);
  font-size: 0.95rem;
  line-height: 1.65;
}
.tree-node { margin-bottom: 2px; }
.tree-children {
  display: none;
  padding-left: 16px;
  border-left: 2px solid var(--accent-soft);
  margin-top: 2px;
  margin-bottom: 4px;
}
.tree-node.open > .tree-children { display: block; }
.tree-label {
  display: block;
  background: var(--blank-bg);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  min-height: 1.85em;
  transition: all 0.2s;
  border: 1px solid transparent;
  user-select: none;
  margin-bottom: 3px;
}
.tree-label:hover { border-color: var(--accent); }
.tree-label .tree-text { display: none; }
.tree-label .tree-placeholder { color: var(--fg-dim); opacity: 0.35; font-family: var(--ui); font-size: 0.8rem; }
.tree-label.show {
  background: none;
  border-color: transparent;
}
.tree-label.show .tree-text { display: inline; }
.tree-label.show .tree-placeholder { display: none; }
.tree-label.show:hover {
  background: var(--red-soft);
  border-color: var(--red);
}
.tree-num {
  font-family: var(--ui);
  font-size: 0.72rem;
  color: var(--fg-dim);
  opacity: 0.6;
  margin-right: 6px;
}
.tree-parts {
  color: var(--fg-dim);
  font-style: italic;
  font-family: var(--ui);
  font-size: 0.85em;
}

/* --- Shared UI --- */
.blanks-score {
  text-align: center;
  margin-top: 14px;
  font-size: 0.82rem;
  color: var(--fg-dim);
}
.btn-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  font-family: var(--ui);
  font-weight: 500;
  font-size: 0.82rem;
  padding: 8px 18px;
  border-radius: var(--r);
  border: none;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  background: var(--accent);
  color: #fff;
}
.btn:hover { background: var(--accent-hover); }
.btn-sm { padding: 6px 14px; font-size: 0.78rem; }
.btn-outline {
  background: none;
  border: 1px solid var(--accent-soft);
  color: var(--fg-dim);
}
.btn-outline:hover {
  border-color: var(--accent);
  color: var(--fg);
  background: var(--accent-soft);
}

@media (max-width: 480px) {
  #menu h1 { font-size: 1.6rem; }
  #menu .subtitle { font-size: 0.85rem; margin-bottom: 28px; }
  .prayer-btn { padding: 22px 20px; }
  .prayer-btn .prayer-name { font-size: 1.15rem; }
  .prayer-btn .prayer-info { font-size: 0.82rem; }
  #practice h1 { font-size: 1.3rem; }
  .blanks-area { font-size: 1.05rem; }
  .line-blank { padding: 6px 12px; }
  .tree-area { font-size: 1rem; }
  .tree-label { padding: 8px 12px; }
  .tree-children { padding-left: 12px; }
  .btn { padding: 10px 20px; font-size: 0.85rem; }
  .btn-sm { padding: 8px 16px; font-size: 0.82rem; }
}
</style>
</head>

<div class="wrap">
  <!-- Menu -->
  <div id="menu">

        <button class="btn btn-sm btn-outline" id="tree-collapse">Collapse All</button>

    </div>
  </div>
</div>

/* ---- State ---- */
var currentItem = null;
var linesTotal = 0;
var treeTotal = 0;
var treeRevealed = 0;

/* ---- Build menu ---- */
var list = document.getElementById("item-list");
ITEMS.forEach(function(item, idx) {
  var btn = document.createElement("button");
  btn.className = "prayer-btn";
  btn.innerHTML = '<div class="prayer-name">' + item.name + '</div><div class="prayer-info">' + item.info + '</div>';
  btn.addEventListener("click", function() { openItem(idx); });
  list.appendChild(btn);
});

/* ---- Open / Back ---- */
function openItem(idx) {
  currentItem = ITEMS[idx];
  document.getElementById("menu").style.display = "none";
  document.getElementById("practice").style.display = "block";
  document.getElementById("practice-title").textContent = currentItem.name;

  if (currentItem.type === "lines") {
    document.getElementById("lines-view").style.display = "block";
    document.getElementById("tree-view").style.display = "none";
    initLines();
  } else {
    document.getElementById("lines-view").style.display = "none";
    document.getElementById("tree-view").style.display = "block";
    initTree();
  }
}

function goBack() {
  document.getElementById("practice").style.display = "none";
  document.getElementById("lines-view").style.display = "none";
  document.getElementById("tree-view").style.display = "none";
  document.getElementById("menu").style.display = "block";
  currentItem = null;
}
document.getElementById("back-btn").addEventListener("click", goBack);

/* ---- Fill Lines ---- */
function initLines() {
  var area = document.getElementById("lines-area");
  var stanzas = currentItem.stanzas;
  var showNums = currentItem.showNums;
  linesTotal = 0;
  stanzas.forEach(function(st) { linesTotal += st.length; });

  area.innerHTML = stanzas.map(function(st, si) {
    var linesHtml = st.map(function(line) {
      return '<span class="line-blank" tabindex="0">' +
        '<span class="line-text">' + line + '</span>' +
        '<span class="line-placeholder">• • •</span>' +
        '</span>';
    }).join("");
    var numHtml = showNums ? '<span class="blanks-stanza-num">' + (si + 1) + '</span>' : '';
    return '<span class="blanks-stanza">' + numHtml + linesHtml + '</span>';
  }).join("");

  area.querySelectorAll(".line-blank").forEach(function(el) {
    var toggle = function() {
      if (el.classList.contains("show")) {
        el.classList.remove("show");
        linesTotal++;
      } else {
        el.classList.add("show");
        linesTotal--;
      }
      updateLinesScore();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
  updateLinesScore();
}

function updateLinesScore() {
  document.getElementById("lines-score").textContent = linesTotal > 0
    ? linesTotal + " line" + (linesTotal !== 1 ? "s" : "") + " hidden"
    : "All lines revealed!";
}

document.getElementById("lines-reveal").addEventListener("click", function() {
  document.querySelectorAll("#lines-area .line-blank:not(.show)").forEach(function(el) {
    el.classList.add("show");
  });
  linesTotal = 0;
  updateLinesScore();
});

document.getElementById("lines-hide").addEventListener("click", function() {
  var hidden = 0;
  document.querySelectorAll("#lines-area .line-blank").forEach(function(el) {
    el.classList.remove("show");
    hidden++;
  });
  linesTotal = hidden;
  updateLinesScore();
});

/* ---- Tree ---- */
function countTreeNodes(node) {
  var t = 1;
  if (node.c) node.c.forEach(function(ch) { t += countTreeNodes(ch); });
  return t;
}

function renderTree(node, num) {
  var hasChildren = node.c && node.c.length > 0;
  var text = node.t;
  var partsHtml = '';
  if (hasChildren) {
    var nw = NW[node.c.length];
    if (nw) partsHtml = ' <span class="tree-parts">has ' + nw + ' parts:</span>';
  }
  var numHtml = (num !== null) ? '<span class="tree-num">' + num + '</span>' : '';
  var html = '<div class="tree-node">';
  html += '<div class="tree-label" tabindex="0">';
  html += numHtml;
  html += '<span class="tree-text">' + text + partsHtml + '</span>';
  html += '<span class="tree-placeholder">• • •</span>';
  html += '</div>';
  if (hasChildren) {
    html += '<div class="tree-children">';
    node.c.forEach(function(child, i) {
      html += renderTree(child, i + 1);
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function initTree() {
  var area = document.getElementById("tree-area");
  area.innerHTML = renderTree(currentItem.tree, null);
  treeTotal = countTreeNodes(currentItem.tree);
  treeRevealed = 0;

  area.addEventListener("click", function(e) {
    var label = e.target.closest(".tree-label");
    if (!label) return;
    var node = label.parentElement;
    if (label.classList.contains("show")) {
      label.classList.remove("show");
      node.classList.remove("open");
      treeRevealed--;
      node.querySelectorAll(".tree-children .tree-label.show").forEach(function(d) {
        d.classList.remove("show");
        d.parentElement.classList.remove("open");
        treeRevealed--;
      });
    } else {
      label.classList.add("show");
      node.classList.add("open");
      treeRevealed++;
    }
    updateTreeScore();
  });

  area.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      e.target.click();
    }
  });

  updateTreeScore();
}

function updateTreeScore() {
  var hidden = treeTotal - treeRevealed;
  document.getElementById("tree-score").textContent = hidden > 0
    ? hidden + " topic" + (hidden !== 1 ? "s" : "") + " hidden"
    : "All topics revealed!";
}

document.getElementById("tree-reveal").addEventListener("click", function() {
  document.querySelectorAll("#tree-area .tree-label:not(.show)").forEach(function(label) {
    label.classList.add("show");
    label.parentElement.classList.add("open");
  });
  treeRevealed = treeTotal;
  updateTreeScore();
});

document.getElementById("tree-collapse").addEventListener("click", function() {
  document.querySelectorAll("#tree-area .tree-label.show").forEach(function(label) {
    label.classList.remove("show");
    label.parentElement.classList.remove("open");
  });
  treeRevealed = 0;
  updateTreeScore();
});
</script>
